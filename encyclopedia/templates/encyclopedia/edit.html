{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>Edit Entry</h1>
    <form action="{% url 'save' %}" method="POST">
        {% csrf_token %} 
      
        <input type="text" name="title" placeholder="Title" value="{{title}}"><br>
        <textarea name="contenido">
            {{content}}
        </textarea>
        <input type="submit" value="save entry" class="btn btn-primary">
    </form>
{% endblock %}
