{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="{% static 'encyclo/styles.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">


</head>
<body>
    <div class="row" style="height: 100vh;">
        <div class="sidebar col-lg-2 col-md-9">
            <h2 style="color: white;">Wiki</h2>
        </br>
            <form action="{% url 'search' %}" method="POST">
                {% csrf_token %} 
                <input class="search" type="text" name="q" placeholder="Search">
            </form>
        </br>
            <div class="respon">
                <div>
                    <a style="color: white;" href="{% url 'index' %}">Home</a>
                </div>
        
                <div>
                    <a style="color: white;" href="{% url 'newPage' %}">Create New Page</a>
                </div>

                <div>
                    <a  style="color: white;" href="{% url 'random' %}">Random Page</a>
                </div>
        </div>
            {% block nav %}
            {% endblock %}
        </div>
        <div class="  main col-lg-10 col-md-9">
            {% block body %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
